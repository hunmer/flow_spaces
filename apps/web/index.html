<!doctype html>
<!-- html/body 类对齐原仓库 app/layout.tsx（h-[var(--app-content-height)] overflow-hidden antialiased font-sans） -->
<html
  lang="zh-CN"
  class="h-[var(--app-content-height)] overflow-hidden antialiased font-sans"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- 应用图标：浅色系统用黑底彩图版，深色系统用透明底浅色版 -->
    <link rel="icon" type="image/png" sizes="256x256" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)" href="/brand/icon_dark.png" />
    <link rel="icon" type="image/png" sizes="256x256" media="(prefers-color-scheme: dark)" href="/brand/icon_light.png" />
    <title>Flow Spaces</title>
  </head>
  <body class="h-[var(--app-content-height)] overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
